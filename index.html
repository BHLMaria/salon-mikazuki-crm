<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    margin: 0;
    font-family: 'Noto Sans JP', 'Hiragino Sans', system-ui, sans-serif;
    color: #44403c;
    background-color: #faf8f5;
    background-image:
      radial-gradient(at 0% 0%, rgba(254, 243, 199, 0.4) 0px, transparent 50%),
      radial-gradient(at 100% 0%, rgba(245, 235, 220, 0.5) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(254, 240, 200, 0.3) 0px, transparent 50%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  .serif-jp { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', serif; }
  .serif-num { font-family: 'Noto Serif JP', serif; font-feature-settings: 'tnum'; font-weight: 300; }
  .icon { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: inline-block; vertical-align: middle; }
  .moon-bg { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fcd34d 100%); }
  /* SALON三日月オリジナルスタイル */
  .mz-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(231, 224, 213, 0.7);
    border-radius: 1rem;
    box-shadow: 0 1px 3px rgba(120, 113, 108, 0.06), 0 1px 2px rgba(120, 113, 108, 0.04);
    transition: all 0.3s ease;
  }
  .mz-card:hover {
    box-shadow: 0 4px 12px rgba(180, 140, 80, 0.08), 0 2px 4px rgba(180, 140, 80, 0.05);
    border-color: rgba(217, 199, 165, 0.8);
  }
  .mz-card-flat {
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(231, 224, 213, 0.6);
    border-radius: 0.75rem;
  }
  .mz-gold-line {
    background: linear-gradient(90deg, transparent 0%, rgba(180, 140, 80, 0.3) 20%, rgba(217, 169, 99, 0.5) 50%, rgba(180, 140, 80, 0.3) 80%, transparent 100%);
    height: 1px;
  }
  .mz-divider-moon {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    color: rgba(180, 140, 80, 0.6);
  }
  .mz-divider-moon::before,
  .mz-divider-moon::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(180, 140, 80, 0.3), transparent);
  }
  .mz-btn-primary {
    background: linear-gradient(135deg, #57534e 0%, #44403c 100%);
    color: #fef3c7;
    border: 1px solid rgba(180, 140, 80, 0.3);
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    transition: all 0.2s;
  }
  .mz-btn-primary:hover {
    background: linear-gradient(135deg, #44403c 0%, #292524 100%);
    box-shadow: 0 2px 4px rgba(180, 140, 80, 0.15);
  }
  .mz-btn-accent {
    background: linear-gradient(135deg, #d4a04b 0%, #b8862e 100%);
    color: white;
    border: none;
    transition: all 0.2s;
  }
  .mz-btn-accent:hover {
    background: linear-gradient(135deg, #b8862e 0%, #966a1b 100%);
    box-shadow: 0 2px 6px rgba(180, 140, 80, 0.25);
  }
  .mz-header {
    background: linear-gradient(180deg, rgba(255, 252, 245, 0.95) 0%, rgba(252, 248, 240, 0.85) 100%);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(217, 199, 165, 0.4);
    box-shadow: 0 1px 3px rgba(180, 140, 80, 0.05);
  }
  .mz-nav {
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(231, 224, 213, 0.5);
  }
  .mz-tab-active {
    color: #92400e;
    border-bottom-color: #d4a04b;
  }
  .mz-tab-active::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -2px;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    background: #d4a04b;
    border-radius: 50%;
  }
  .mz-moon-icon {
    color: #d4a04b;
    filter: drop-shadow(0 0 3px rgba(217, 169, 99, 0.4));
  }
  .mz-kpi-amber {
    background: linear-gradient(135deg, rgba(254, 243, 199, 0.7) 0%, rgba(253, 230, 138, 0.5) 100%);

    border: 1px solid rgba(110, 169, 119, 0.4);

  }

    background: linear-gradient(135deg, rgba(237, 233, 254, 0.7) 0%, rgba(221, 214, 254, 0.5) 100%);
    border: 1px solid rgba(167, 139, 200, 0.4);
    color: #5b21b6;
  }
  .mz-kpi-stone {
    background: linear-gradient(135deg, rgba(245, 245, 244, 0.7) 0%, rgba(231, 229, 228, 0.5) 100%);
    border: 1px solid rgba(168, 162, 158, 0.4);

  }

  }

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo } = React;

// ============================================================
// アイコンコンポーネント
// ============================================================
const Icon = ({ name, className = "" }) => (
  <svg className={`icon ${className}`}><use href={`#i-${name}`} /></svg>
);

// ============================================================
// localStorage 永続化フック
// ============================================================
function useLocalState(key, initialValue) {
  const [value, setValue] = useState(() => {
    try {
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : initialValue;
    } catch (e) {
      return initialValue;
    }
  });
  useEffect(() => {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      console.warn('localStorage write failed:', e);
    }
  }, [key, value]);
  return [value, setValue];
}

// ============================================================
// 共通ユーティリティ
// ============================================================
const genId = (prefix) => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
const nowISO = () => new Date().toISOString();
const fmtDate = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}`;
};
const fmtDateTime = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${fmtDate(iso)} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
};

// ============================================================
// 操作ログ(設計合意書第10章に基づく監査ログ)
// ============================================================
function appendAuditLog(action, target, detail = "") {
  try {
    const logs = JSON.parse(localStorage.getItem('mikazuki_audit') || '[]');
    logs.push({
      id: genId('log'),
      timestamp: nowISO(),
      action,    // e.g. 'view', 'create', 'update', 'delete'
      target,    // e.g. 'customer:cust_xxx'
      detail,
    });
    // 直近1000件のみ保持(localStorage上限対策)
    const trimmed = logs.slice(-1000);
    localStorage.setItem('mikazuki_audit', JSON.stringify(trimmed));
  } catch (e) {
    console.warn('audit log write failed:', e);
  }
}

// ============================================================
// ヘッダー
// ============================================================
const Header = ({ currentPage, onNav }) => (

          <Icon name="moon" className="mz-moon-icon text-3xl relative" />
        </div>
        <div className="serif-jp">
          <div className="text-stone-800 text-xl tracking-wider" style={{letterSpacing: '0.08em'}}>SALON<span className="text-amber-700 mx-1">三日月</span></div>
          <div className="text-[10px] text-stone-500 tracking-widest" style={{letterSpacing: '0.2em'}}>SUITE CUSTOMER RELATIONS</div>
        </div>
      </div>
      <div className="text-xs text-stone-500 flex items-center gap-2 serif-jp">
        <Icon name="shield" className="text-stone-400" />
        <span>サロンスタッフ専用 / 守秘義務下で運用</span>
      </div>
    </div>
    <div className="mz-gold-line"></div>
  </header>
);

// ============================================================
// ナビゲーション
// ============================================================
const NAV_ITEMS = [
  { key: 'dashboard',   label: 'ダッシュボード',  icon: 'home' },
  { key: 'reservation', label: '来店予約',         icon: 'calendar' },
  { key: 'customers',   label: '顧客マスター',     icon: 'users' },
  { key: 'records',     label: '施術記録',         icon: 'clipboard' },
  { key: 'keigetsu',    label: '慧月予約',         icon: 'link2' },
  { key: 'settings',    label: '設定',             icon: 'settings' },
];

const Nav = ({ currentPage, onNav }) => (
  <nav className="mz-nav no-print">
    <div className="max-w-7xl mx-auto px-4 flex overflow-x-auto serif-jp">
      {NAV_ITEMS.map(item => (
        <button
          key={item.key}
          onClick={() => onNav(item.key)}
          className={`relative px-4 py-3 text-sm flex items-center gap-2 border-b-2 whitespace-nowrap transition-all ${
            currentPage === item.key
              ? 'mz-tab-active border-amber-500 font-medium'
              : 'border-transparent text-stone-600 hover:text-amber-700'

        </button>

);

// フッター
// ============================================================

          <div className="serif-jp text-stone-700 tracking-wider" style={{letterSpacing: '0.1em'}}>SALON 三日月</div>
        </div>
        <div className="serif-jp">予防・養生支援を目的としたサービスです(医療行為ではありません)</div>
        <div className="mt-2 text-stone-400 text-[11px] serif-jp">
          個人情報保護法・薬機法・景表法に準拠 / 公認心理師の業務範囲内で運用
        </div>

  const totalCustomers = customers.length;

  const consentComplete = customers.filter(c => c.consent && c.consent.signedAt).length;

  // Phase B 集計
  const totalTreatments = treatments.length;
  const treatmentsToday = treatments.filter(t => t.treatmentDate && new Date(t.treatmentDate).toDateString() === today).length;
  const keigetsuPending = keigetsuSessions.filter(s => s.status === 'pending').length;
  const keigetsuToday = keigetsuSessions.filter(s => s.sessionDate && new Date(s.sessionDate).toDateString() === today).length;

  // 来店予約集計
  const reservationsToday = reservations.filter(r => r.reservationDate && new Date(r.reservationDate).toDateString() === today).length;

    <div className="max-w-7xl mx-auto px-4 py-8">

        <div className="mz-divider-moon mt-4">
          <span className="text-base">☾</span>
        </div>
      </div>

      <div className="mb-3 text-xs text-stone-500 serif-jp" style={{letterSpacing: '0.1em'}}>● 顧客</div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <Kpi label="登録顧客数(累計)" value={totalCustomers} suffix="名" icon="users" color="amber" />
        <Kpi label="アクティブ顧客" value={activeCustomers} suffix="名" icon="user" color="emerald" />
        <Kpi label="本日の新規登録" value={newToday} suffix="名" icon="plus" color="stone" />
        <Kpi label="同意取得済み" value={consentComplete} suffix="名" icon="shield" color="stone" />
      </div>

      <div className="mb-3 text-xs text-stone-500 serif-jp" style={{letterSpacing: '0.1em'}}>● 本日の予定</div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <Kpi label="本日の来店予約" value={reservationsToday} suffix="件" icon="calendar" color="amber" />
        <Kpi label="来店予約(申込中)" value={reservationsPending} suffix="件" icon="calendar" color="stone" />
        <Kpi label="本日の慧月予約" value={keigetsuToday} suffix="件" icon="link2" color="violet" />
        <Kpi label="慧月予約(申込中)" value={keigetsuPending} suffix="件" icon="link2" color="stone" />
      </div>

      <div className="mb-3 text-xs text-stone-500 serif-jp" style={{letterSpacing: '0.1em'}}>● 施術</div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <Kpi label="本日の施術件数" value={treatmentsToday} suffix="件" icon="clipboard" color="amber" />
        <Kpi label="施術記録(累計)" value={totalTreatments} suffix="件" icon="clipboard" color="stone" />
      </div>

      <div className="mz-card p-5 mb-8 border-amber-200/60">
        <div className="flex items-start gap-3">
          <div className="w-10 h-10 rounded-full flex items-center justify-center bg-amber-50 border border-amber-200 flex-shrink-0">
            <Icon name="alert-circle" className="text-amber-600 text-xl" />
          </div>
          <div className="text-sm text-stone-700">
            <div className="font-medium mb-1 serif-jp tracking-wider" style={{letterSpacing: '0.05em'}}>運用について</div>
            <div className="serif-jp leading-relaxed text-stone-600">
              顧客マスター・来店予約・慧月予約管理・施術記録が利用できます。<br/>
              店舗施術予約の自動受信(ホテル予約サイト連携)は <span className="font-medium text-amber-700">6月16日</span> の打ち合わせ後に実装予定です。
            </div>
          </div>
        </div>
      </div>

      <div className="mb-3 text-xs text-stone-500 serif-jp" style={{letterSpacing: '0.1em'}}>● よく使う機能</div>
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

// 顧客マスター — 一覧
// ============================================================
const Customers = ({ customers, setCustomers, onSelectCustomer, onOpenForm }) => {
  const [query, setQuery] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');

  const filtered = useMemo(() => {
    let list = customers;
    if (statusFilter !== 'all') {
      list = list.filter(c => c.status === statusFilter);
    }
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter(c =>
        (c.pseudonym || '').toLowerCase().includes(q) ||
        (c.email || '').toLowerCase().includes(q) ||
        (c.phone || '').toLowerCase().includes(q)
      );
    }
    return list.slice().sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  }, [customers, query, statusFilter]);

  return (
    <div className="max-w-7xl mx-auto px-4 py-6">
      <div className="flex items-center justify-between mb-4">
        <div>
          <h2 className="serif-jp text-2xl text-stone-800">顧客マスター</h2>
          <p className="text-sm text-stone-500">登録顧客の一覧・検索・新規登録</p>
        </div>
        <button
          onClick={onOpenForm}
          className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2"
        >
          <Icon name="plus" />新規顧客を登録
        </button>
      </div>

      <div className="bg-white border border-stone-200 rounded-lg p-4 mb-4">
        <div className="flex flex-col md:flex-row gap-3">
          <div className="relative flex-1">
            <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
            <input
              type="text"
              value={query}
              onChange={e => setQuery(e.target.value)}
              placeholder="氏名・メール・電話で検索"
              className="w-full pl-10 pr-4 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:border-amber-400"
            />
          </div>
          <select
            value={statusFilter}
            onChange={e => setStatusFilter(e.target.value)}
            className="px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:border-amber-400"
          >
            <option value="all">すべて</option>
            <option value="active">アクティブ</option>
            <option value="inactive">休眠</option>
          </select>
        </div>
        <div className="text-xs text-stone-500 mt-2">
          {filtered.length} 名 / 全 {customers.length} 名
        </div>
      </div>

      {filtered.length === 0 ? (
        <div className="bg-stone-50 border border-stone-200 rounded-lg p-8 text-center text-stone-500">
          <Icon name="users" className="text-3xl text-stone-300 mb-2" />
          <div className="text-sm">
            {customers.length === 0
              ? '登録された顧客はまだいません。「新規顧客を登録」から始めてください。'
              : '検索条件に一致する顧客がいません。'}
          </div>
        </div>
      ) : (
        <div className="bg-white border border-stone-200 rounded-lg overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-stone-50 text-stone-600 text-xs">
              <tr>
                <th className="text-left px-4 py-2 font-medium">氏名</th>
                <th className="text-left px-4 py-2 font-medium hidden md:table-cell">連絡先</th>
                <th className="text-left px-4 py-2 font-medium hidden md:table-cell">同意</th>
                <th className="text-left px-4 py-2 font-medium hidden lg:table-cell">登録日</th>
                <th className="text-left px-4 py-2 font-medium">状態</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(c => (
                <tr
                  key={c.id}
                  onClick={() => onSelectCustomer(c.id)}
                  className="border-t border-stone-100 hover:bg-amber-50 cursor-pointer transition-colors"
                >
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-2">
                      <Icon name="user" className="text-stone-400" />
                      <span className="font-medium text-stone-800">{c.pseudonym || '(氏名未登録)'}</span>
                    </div>
                  </td>
                  <td className="px-4 py-3 text-stone-600 hidden md:table-cell">
                    <div className="text-xs">{c.email || '—'}</div>
                    <div className="text-xs text-stone-400">{c.phone || ''}</div>
                  </td>
                  <td className="px-4 py-3 hidden md:table-cell">
                    <ConsentBadge consent={c.consent} />
                  </td>
                  <td className="px-4 py-3 text-xs text-stone-500 hidden lg:table-cell">
                    {fmtDate(c.createdAt)}
                  </td>
                  <td className="px-4 py-3">
                    <StatusBadge status={c.status} />
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
};

const ConsentBadge = ({ consent }) => {
  if (!consent || !consent.signedAt) {
    return <span className="text-xs px-2 py-0.5 rounded bg-rose-50 text-rose-700 border border-rose-200">未取得</span>;
  }
  const complete = consent.dataUse && consent.internalShare;
  return complete
    ? <span className="text-xs px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">取得済</span>
    : <span className="text-xs px-2 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-200">一部</span>;
};

const StatusBadge = ({ status }) => {
  if (status === 'inactive') return <span className="text-xs px-2 py-0.5 rounded bg-stone-100 text-stone-600">休眠</span>;
  return <span className="text-xs px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">アクティブ</span>;
};

// ============================================================
// 顧客マスター — 新規登録 / 編集フォーム
// ============================================================
const CustomerForm = ({ initial, onSave, onCancel, onDelete }) => {
  const [form, setForm] = useState(() => initial || {
    id: '',
    pseudonym: '',
    email: '',
    phone: '',
    birthYear: '',
    gender: '',
    notes: '',
    consent: {
      dataUse: false,
      online: false,
      photo: false,
      internalShare: false,
      signedAt: '',
    },
    status: 'active',
    createdAt: '',
    updatedAt: '',
  });

  const update = (field, value) => setForm(f => ({ ...f, [field]: value }));
  const updateConsent = (field, value) => setForm(f => ({
    ...f,
    consent: { ...f.consent, [field]: value }
  }));

  const handleSave = () => {
    if (!form.pseudonym.trim()) {
      alert('氏名は必須です。');
      return;
    }
    if (!form.consent.dataUse) {
      alert('「データ利用同意」がない顧客は登録できません(個人情報保護法準拠)。');
      return;
    }
    const now = nowISO();
    const record = {
      ...form,
      id: form.id || genId('cust'),
      createdAt: form.createdAt || now,
      updatedAt: now,
      consent: {
        ...form.consent,
        signedAt: form.consent.signedAt || now,
      }
    };
    onSave(record);
  };

  const isEdit = !!form.id;

  return (
    <div className="max-w-3xl mx-auto px-4 py-6">
      <div className="flex items-center gap-2 mb-4">
        <button onClick={onCancel} className="text-stone-500 hover:text-stone-800 flex items-center gap-1 text-sm">
          <Icon name="arrow-left" />戻る
        </button>
      </div>

      <h2 className="serif-jp text-2xl text-stone-800 mb-1">
        {isEdit ? '顧客情報を編集' : '新規顧客を登録'}
      </h2>
      <p className="text-sm text-stone-500 mb-6">
        診断的記述・症状名・治療相当の記述は記載しません(予防・養生支援目的)
      </p>

      <div className="bg-white border border-stone-200 rounded-lg p-6 space-y-5">
        {/* 基本情報 */}
        <section>
          <h3 className="text-sm font-medium text-stone-700 mb-3 border-b border-stone-200 pb-1">基本情報</h3>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <Field label="氏名" required>
              <input
                type="text"
                value={form.pseudonym}
                onChange={e => update('pseudonym', e.target.value)}
                className="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-amber-400"
                placeholder="例: 山田 花子"
              />
            </Field>
            <Field label="メールアドレス">
              <input
                type="email"
                value={form.email}
                onChange={e => update('email', e.target.value)}
                className="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-amber-400"
              />
            </Field>
            <Field label="電話番号">
              <input
                type="tel"
                value={form.phone}
                onChange={e => update('phone', e.target.value)}
                className="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-amber-400"
              />
            </Field>
            <Field label="生年(西暦)">
              <input
                type="number"
                value={form.birthYear}
                onChange={e => update('birthYear', e.target.value)}
                placeholder="例: 1985"
                className="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-amber-400"
              />
            </Field>
            <Field label="性別">
              <select
                value={form.gender}
                onChange={e => update('gender', e.target.value)}
                className="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-amber-400"
              >
                <option value="">選択しない</option>
                <option value="female">女性</option>
                <option value="male">男性</option>
                <option value="other">その他</option>
                <option value="prefer_not">回答しない</option>
              </select>
            </Field>
            <Field label="状態">
              <select
                value={form.status}
                onChange={e => update('status', e.target.value)}
                className="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-amber-400"
              >
                <option value="active">アクティブ</option>
                <option value="inactive">休眠</option>
              </select>
            </Field>
          </div>
        </section>

        {/* メモ */}
        <section>
          <h3 className="text-sm font-medium text-stone-700 mb-3 border-b border-stone-200 pb-1">メモ(任意)</h3>
          <textarea
            value={form.notes}
            onChange={e => update('notes', e.target.value)}
            rows={3}
            className="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-amber-400"
            placeholder="連絡時の留意点、希望時間帯など(診断・症状の記録はしないでください)"
          />
        </section>

        {/* 同意管理 */}
        <section>
          <h3 className="text-sm font-medium text-stone-700 mb-3 border-b border-stone-200 pb-1">
            同意管理(個人情報保護法準拠)
          </h3>
          <div className="space-y-2 text-sm">
            <Consent
              label="データ利用への同意"
              desc="サービス提供に必要なデータ利用に同意"
              checked={form.consent.dataUse}
              onChange={v => updateConsent('dataUse', v)}
              required
            />
            <Consent
              label="オンライン提供への同意"
              desc="慧月オンラインカウンセリング・FMPアプリ等の利用"
              checked={form.consent.online}
              onChange={v => updateConsent('online', v)}
            />
            <Consent
              label="写真利用への同意"
              desc="施術前後の状態確認や記録のための写真利用"
              checked={form.consent.photo}
              onChange={v => updateConsent('photo', v)}
            />
            <Consent
              label="サロン内情報共有への同意"
              desc="担当者(PT・公認心理師・スタッフ)間で必要な範囲の情報を共有"
              checked={form.consent.internalShare}
              onChange={v => updateConsent('internalShare', v)}
            />
          </div>
          {form.consent.signedAt && (
            <div className="mt-2 text-xs text-stone-500">
              最終同意取得日: {fmtDateTime(form.consent.signedAt)}
            </div>
          )}
        </section>
      </div>

      <div className="flex items-center justify-between mt-6">
        <div>
          {isEdit && (
            <button
              onClick={() => {
                if (confirm(`「${form.pseudonym}」を削除しますか?この操作は取り消せません。`)) {
                  onDelete(form.id);
                }
              }}
              className="text-rose-600 hover:text-rose-800 text-sm flex items-center gap-1"
            >
              <Icon name="trash" />削除
            </button>
          )}
        </div>
        <div className="flex gap-2">
          <button onClick={onCancel} className="px-4 py-2 border border-stone-300 rounded text-sm text-stone-700 hover:bg-stone-50">
            キャンセル
          </button>
          <button onClick={handleSave} className="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded text-sm">
            {isEdit ? '更新する' : '登録する'}
          </button>
        </div>
      </div>
    </div>
  );
};

const Field = ({ label, required, children }) => (
  <div>
    <label className="block text-xs text-stone-600 mb-1">
      {label}{required && <span className="text-rose-500 ml-1">*</span>}
    </label>
    {children}
  </div>
);

const Consent = ({ label, desc, checked, onChange, required }) => (
  <label className="flex items-start gap-3 p-2 hover:bg-stone-50 rounded cursor-pointer">
    <input
      type="checkbox"
      checked={!!checked}
      onChange={e => onChange(e.target.checked)}
      className="mt-1"
    />
    <div className="flex-1">
      <div className="text-stone-800">
        {label}{required && <span className="text-rose-500 ml-1">*</span>}
      </div>
      <div className="text-xs text-stone-500">{desc}</div>
    </div>
  </label>
);

        {/* ヘッダー */}

            <Icon name="user" className="text-amber-700 text-3xl" />
            <div>
              <div className="serif-jp text-2xl text-stone-800">{customer.pseudonym}</div>

        {/* 警告バナー */}
        {shareWarning && (
          <div className="bg-rose-50 border-b border-rose-200 px-6 py-3 flex items-start gap-2">
            <Icon name="alert-circle" className="text-rose-600 mt-0.5" />
            <div className="text-sm text-rose-800">
              <div className="font-medium">サロン内情報共有への同意が未取得です</div>
              <div className="text-xs mt-0.5">
                施術記録・カウンセリング記録の閲覧・共有はできません。本人から改めて同意を取得してください。
              </div>
            </div>
          </div>
        )}

        {/* 基本情報 */}
        <Section title="基本情報">
          <Info label="メール" value={customer.email} />
          <Info label="電話" value={customer.phone} />
          <Info label="生年" value={customer.birthYear} />
          <Info label="性別" value={genderLabel(customer.gender)} />
        </Section>

        {/* 同意状況 */}
        <Section title="同意状況">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
            {consentItems.map(item => (
              <div key={item.key} className="flex items-center gap-2 text-sm">
                {customer.consent?.[item.key]
                  ? <Icon name="check-circle" className="text-emerald-600" />
                  : <Icon name="x" className="text-stone-300" />
                }
                <span className={customer.consent?.[item.key] ? 'text-stone-800' : 'text-stone-400'}>
                  {item.label}
                </span>
              </div>
            ))}
          </div>
          {customer.consent?.signedAt && (
            <div className="text-xs text-stone-500 mt-3">
              最終同意取得日時: {fmtDateTime(customer.consent.signedAt)}
            </div>
          )}
        </Section>

        {/* メモ */}
        {customer.notes && (
          <Section title="メモ">
            <div className="text-sm text-stone-700 whitespace-pre-wrap">{customer.notes}</div>
          </Section>
        )}

        {/* 施術記録(Phase B 実装) */}
        <Section title="サロン施術記録">
          {(() => {
            const list = treatments.filter(t => t.customerId === customer.id)
              .slice().sort((a, b) => (b.treatmentDate || '').localeCompare(a.treatmentDate || ''));
            if (list.length === 0) {
              return <div className="text-sm text-stone-500">記録なし</div>;
            }
            return (
              <div className="space-y-2">
                {list.map(t => (
                  <div key={t.id} className="border border-stone-200 rounded p-3 text-sm">
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <StaffRoleBadge role={t.staffRole} />
                        <span className="text-stone-700 font-medium">{fmtDateTime(t.treatmentDate)}</span>
                      </div>
                      <div className="text-xs text-stone-500">{t.staffName || '-'}</div>
                    </div>
                    {t.menuName && <div className="text-xs text-stone-600 mb-1">メニュー:{t.menuName}</div>}
                    {t.clientStatement && (
                      <div className="text-xs text-stone-600 mt-1">
                        <span className="text-stone-500">訴え:</span> {t.clientStatement}
                      </div>
                    )}
                    {t.treatmentContent && (
                      <div className="text-xs text-stone-600 mt-1">
                        <span className="text-stone-500">ケア:</span> {t.treatmentContent}
                      </div>
                    )}
                    {t.staffRole === 'pt' && t.observation && (
                      <div className="text-xs text-stone-600 mt-1">
                        <span className="text-stone-500">観察:</span> {t.observation}
                      </div>
                    )}
                    {t.staffRole === 'pt' && t.medicalReferralNeeded && (
                      <div className="mt-2 bg-rose-50 border border-rose-200 rounded px-2 py-1 text-xs text-rose-700 flex items-start gap-1">
                        <Icon name="alert-circle" className="mt-0.5 w-3 h-3" />
                        <span><strong>医師連携要:</strong> {t.medicalReferralDetail || '内容未記入'}</span>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            );
          })()}
        </Section>

        {/* 慧月カウンセリング記録(Phase B 実装) */}
        <Section title="慧月カウンセリング記録">
          {(() => {
            const list = keigetsuSessions.filter(s => s.customerId === customer.id || s.customerName === customer.pseudonym)
              .slice().sort((a, b) => (b.sessionDate || '').localeCompare(a.sessionDate || ''));
            if (list.length === 0) {
              return <div className="text-sm text-stone-500">記録なし</div>;
            }
            return (
              <div className="space-y-2">
                {list.map(s => (
                  <div key={s.id} className="border border-stone-200 rounded p-3 text-sm">
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <KeigetsuStatusBadge status={s.status} />
                        <span className="text-stone-700 font-medium">{fmtDateTime(s.sessionDate)}</span>
                        <span className="text-xs text-stone-500">({s.sessionNumber}回目)</span>
                      </div>
                      <div className="text-xs text-stone-500">{s.counselorName || '-'}</div>
                    </div>
                    {s.factualReport && (
                      <div className="text-xs text-stone-600 mt-1">
                        <span className="text-stone-500">発信事実:</span> {s.factualReport}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            );
          })()}
        </Section>

        {/* 来店履歴(Phase C プレースホルダー) */}
        <Section title="来店・利用履歴">
          <PhasePlaceholder
            phase="C"
            desc="来店日時・利用サービス・累計来店数などの統計がここに表示されます。"
          />
        </Section>
      </div>
    </div>
  );
};

  <div className="px-6 py-5 border-b border-stone-100 last:border-b-0">

);

);

const RESERVATION_STATUS = {

  confirmed:  { label: '確定',       bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200' },
  completed:  { label: '実施済',     bg: 'bg-stone-100',  text: 'text-stone-700',   border: 'border-stone-300' },
  cancelled:  { label: 'キャンセル', bg: 'bg-rose-50',    text: 'text-rose-700',    border: 'border-rose-200' },
  no_show:    { label: '無断欠席',   bg: 'bg-rose-100',   text: 'text-rose-800',    border: 'border-rose-300' },
};

const RESERVATION_SOURCE = {
  manual:      { label: '手動',       icon: 'plus' },
  hotel_site:  { label: 'ホテル予約', icon: 'home' },
  phone:       { label: '電話',       icon: 'phone' },
  direct:      { label: '直接来店',   icon: 'user' },
  other:       { label: 'その他',     icon: 'mail' },
};

const SALON_MENUS = [
  '新月(温熱60分)',
  '華月(温熱90分・全身)',
  '満月(エステ60分)',
  '望月(エステ90分・フルケア)',
  '宵月(リラクゼーション45分)',
  '慧月(PTセッション60分)',
  '(その他・自由記入)',
];

const ReservationStatusBadge = ({ status }) => {
  const s = RESERVATION_STATUS[status] || RESERVATION_STATUS.pending;
  return (
    <span className={`mz-pill ${s.bg} ${s.text} ${s.border}`}>{s.label}</span>
  );
};

const ReservationSourceBadge = ({ source }) => {
  const s = RESERVATION_SOURCE[source] || RESERVATION_SOURCE.manual;
  return (
    <span className="mz-pill bg-stone-50 text-stone-600 border-stone-200">
      {s.label}
    </span>
  );
};

const ReservationForm = ({ initial, customers, onSave, onCancel, onDelete }) => {
  const isEdit = !!(initial && initial.createdAt && initial.id);
  const [form, setForm] = useState(() => initial || {
    id: genId('res'),
    customerId: null,
    customerName: '',
    reservationDate: '',
    menuName: '',
    expectedStaff: '',
    expectedStaffRole: 'thermal',
    estimatedDuration: 60,
    status: 'pending',
    source: 'manual',
    sourceRef: '',
    contactInfo: '',
    notes: '',
    createdAt: nowISO(),
    updatedAt: nowISO(),
  });

  const update = (field, v) => setForm({ ...form, [field]: v });

  const handleCustomerSelect = (cid) => {
    if (!cid) { update('customerId', null); return; }
    const c = customers.find(x => x.id === cid);
    setForm({ ...form, customerId: cid, customerName: c ? (c.pseudonym || '') : form.customerName });
  };

  const handleSubmit = () => {
    if (!form.customerName.trim()) { alert('顧客名を入力してください。'); return; }
    if (!form.reservationDate) { alert('予約日時を入力してください。'); return; }
    const final = { ...form, updatedAt: nowISO() };
    if (!isEdit) final.createdAt = nowISO();
    onSave(final);
  };

  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-xl">
        <div className="border-b border-stone-200 px-6 py-4 flex items-center justify-between">
          <h3 className="serif-jp text-lg text-stone-800 tracking-wider" style={{letterSpacing: '0.08em'}}>
            {isEdit ? '来店予約の編集' : '来店予約の新規追加'}
          </h3>
          <button onClick={onCancel} className="text-stone-400 hover:text-stone-600"><Icon name="x" /></button>
        </div>
        <div className="mz-gold-line"></div>
        <div className="px-6 py-5 space-y-4">
          <div>
            <label className="block text-xs font-medium text-stone-600 mb-1 serif-jp">顧客マスター(任意・既登録顧客から選択)</label>
            <select value={form.customerId || ''} onChange={e => handleCustomerSelect(e.target.value)} className="w-full mz-input text-sm">
              <option value="">(未紐付け / 顧客名のみ入力)</option>
              {customers.map(c => (
                <option key={c.id} value={c.id}>{c.pseudonym}</option>
              ))}
            </select>
          </div>
          <div>
            <label className="block text-xs font-medium text-stone-600 mb-1 serif-jp">顧客名 <span className="text-rose-500">*</span></label>
            <input type="text" value={form.customerName} onChange={e => update('customerName', e.target.value)}
              className="w-full mz-input text-sm" placeholder="例:山田 花子" />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-xs font-medium text-stone-600 mb-1 serif-jp">予約日時 <span className="text-rose-500">*</span></label>
              <input type="datetime-local" value={form.reservationDate} onChange={e => update('reservationDate', e.target.value)}
                className="w-full mz-input text-sm" />
            </div>
            <div>
              <label className="block text-xs font-medium text-stone-600 mb-1 serif-jp">所要時間(分)</label>
              <select value={form.estimatedDuration} onChange={e => update('estimatedDuration', Number(e.target.value))}
                className="w-full mz-input text-sm">
                <option value={30}>30分</option>
                <option value={45}>45分</option>
                <option value={60}>60分</option>
                <option value={90}>90分</option>
                <option value={120}>120分</option>
              </select>
            </div>
          </div>
          <div>
            <label className="block text-xs font-medium text-stone-600 mb-1 serif-jp">メニュー</label>
            <select value={SALON_MENUS.includes(form.menuName) ? form.menuName : '(その他・自由記入)'}
              onChange={e => {
                if (e.target.value === '(その他・自由記入)') update('menuName', '');
                else update('menuName', e.target.value);
              }}
              className="w-full mz-input text-sm mb-2">
              {SALON_MENUS.map(m => <option key={m} value={m}>{m}</option>)}
            </select>
            {!SALON_MENUS.slice(0, -1).includes(form.menuName) && (
              <input type="text" value={form.menuName} onChange={e => update('menuName', e.target.value)}
                className="w-full mz-input text-sm" placeholder="メニュー名を自由入力" />
            )}
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-xs font-medium text-stone-600 mb-1 serif-jp">担当予定職種</label>
              <select value={form.expectedStaffRole} onChange={e => update('expectedStaffRole', e.target.value)}
                className="w-full mz-input text-sm">
                <option value="thermal">温熱療法士</option>
                <option value="esthetician">エステティシャン</option>
                <option value="pt">理学療法士</option>
              </select>
            </div>
            <div>
              <label className="block text-xs font-medium text-stone-600 mb-1 serif-jp">担当予定者名</label>
              <input type="text" value={form.expectedStaff} onChange={e => update('expectedStaff', e.target.value)}
                className="w-full mz-input text-sm" />
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-xs font-medium text-stone-600 mb-1 serif-jp">状態</label>
              <select value={form.status} onChange={e => update('status', e.target.value)}
                className="w-full mz-input text-sm">
                {Object.entries(RESERVATION_STATUS).map(([k, v]) => (
                  <option key={k} value={k}>{v.label}</option>
                ))}
              </select>
            </div>
            <div>
              <label className="block text-xs font-medium text-stone-600 mb-1 serif-jp">受信元</label>
              <select value={form.source} onChange={e => update('source', e.target.value)}
                className="w-full mz-input text-sm">
                {Object.entries(RESERVATION_SOURCE).map(([k, v]) => (
                  <option key={k} value={k}>{v.label}</option>
                ))}
              </select>
            </div>
          </div>
          {form.source === 'hotel_site' && (
            <div>
              <label className="block text-xs font-medium text-stone-600 mb-1 serif-jp">ホテル側予約ID(連携時に使用)</label>
              <input type="text" value={form.sourceRef} onChange={e => update('sourceRef', e.target.value)}
                className="w-full mz-input text-sm" placeholder="ホテル予約システムからのID" />
            </div>
          )}
          <div>
            <label className="block text-xs font-medium text-stone-600 mb-1 serif-jp">連絡先(任意)</label>
            <input type="text" value={form.contactInfo} onChange={e => update('contactInfo', e.target.value)}
              className="w-full mz-input text-sm" placeholder="電話番号やメールアドレス" />
          </div>
          <div>
            <label className="block text-xs font-medium text-stone-600 mb-1 serif-jp">運営メモ(任意・対外非開示)</label>
            <textarea value={form.notes} onChange={e => update('notes', e.target.value)}
              rows={2} className="w-full mz-input text-sm" />
          </div>
        </div>
        <div className="mz-gold-line"></div>
        <div className="px-6 py-4 flex items-center justify-between">
          <div>
            {isEdit && (
              <button onClick={() => onDelete && onDelete(form.id)} className="px-3 py-1.5 text-xs bg-rose-50 text-rose-700 border border-rose-200 rounded-lg hover:bg-rose-100">
                この予約を削除
              </button>
            )}
          </div>
          <div className="flex gap-2">
            <button onClick={onCancel} className="px-4 py-2 text-sm border border-stone-300 rounded-lg text-stone-600 hover:bg-stone-50">キャンセル</button>
            <button onClick={handleSubmit} className="px-5 py-2 text-sm mz-btn-primary rounded-lg">{isEdit ? '更新' : '登録'}</button>
          </div>
        </div>
      </div>
    </div>
  );
};

const ReservationPage = ({ reservations, customers, onSave, onDelete }) => {
  const [filter, setFilter] = useState('all');
  const [filterSource, setFilterSource] = useState('all');
  const [editing, setEditing] = useState(null);
  const [showForm, setShowForm] = useState(false);

  const filtered = reservations
    .filter(r => filter === 'all' || r.status === filter)
    .filter(r => filterSource === 'all' || r.source === filterSource)
    .slice().sort((a, b) => (b.reservationDate || '').localeCompare(a.reservationDate || ''));

  const openNew = () => { setEditing(null); setShowForm(true); };
  const openEdit = (r) => { setEditing(r); setShowForm(true); };
  const closeForm = () => { setShowForm(false); setEditing(null); };

  const handleSave = (r) => { onSave(r); closeForm(); };
  const handleDelete = (id) => {
    if (!confirm('この予約を削除します。よろしいですか?')) return;
    onDelete(id);
    closeForm();
  };

  return (
    <div className="max-w-6xl mx-auto px-4 py-8">
      <div className="flex items-start justify-between mb-2">
        <div>
          <h2 className="serif-jp text-3xl text-stone-800 tracking-wider" style={{letterSpacing: '0.1em'}}>来店予約</h2>
          <p className="text-sm text-stone-500 mt-1 serif-jp">店舗での施術予約の確認・管理</p>
        </div>
        <button onClick={openNew} className="px-4 py-2 mz-btn-accent text-sm rounded-lg flex items-center gap-1 serif-jp">

      </div>
      <div className="mz-divider-moon mt-4 mb-5"><span className="text-base">☾</span></div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
        <div>

              <button key={k} onClick={() => setFilterSource(k)}

                <th className="px-4 py-3" style={{letterSpacing: '0.05em'}}>状態</th>
                <th className="px-4 py-3" style={{letterSpacing: '0.05em'}}>受信元</th>
                <th className="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(r => (
                <tr key={r.id} className="border-b border-stone-100 hover:bg-amber-50/30 cursor-pointer transition-colors" onClick={() => openEdit(r)}>

                  <td className="px-4 py-3 font-medium text-stone-800 serif-jp">{r.customerName || '-'}</td>
                  <td className="px-4 py-3 text-stone-600 serif-jp text-xs">{r.menuName || '-'}</td>
                  <td className="px-4 py-3 text-stone-600 text-xs serif-jp">{r.expectedStaff || '-'}</td>

// 公認心理師への通知メール送信パネル(Vercel Functions経由でResendを呼び出す)
const NotifyCounselorPanel = ({ form, onNotified }) => {
  const [sending, setSending] = useState(false);
  const [result, setResult] = useState(null); // null | { type: 'success' | 'error', msg: string }

  const sendAutomatic = async () => {
    if (!form.counselorEmail) {
      alert('公認心理師のメールアドレスを入力してください。');
      return;
    }
    setSending(true);
    setResult(null);

    try {
      const response = await fetch('/api/notify-counselor', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          counselorEmail: form.counselorEmail,
          counselorName: form.counselorName,
          customerName: form.customerName,
          sessionDate: form.sessionDate,
          sessionNumber: form.sessionNumber,
          zoomUrl: form.zoomUrl,
        }),
      });

      const data = await response.json();

      if (response.ok && data.success) {
        const sentAt = data.sentAt || nowISO();
        setResult({ type: 'success', msg: `送信完了:${form.counselorEmail} へ配信しました。` });
        onNotified(sentAt);
        appendAuditLog('notify', `keigetsu:${form.id}`, `to=${form.counselorEmail}, messageId=${data.messageId || ''}`);
      } else {
        const errMsg = data.error || 'メール送信に失敗しました。';
        setResult({ type: 'error', msg: errMsg });
      }
    } catch (error) {
      setResult({ type: 'error', msg: error.message || 'ネットワークエラー。Vercel Functions または Resend の設定をご確認ください。' });
    } finally {
      setSending(false);
    }
  };

  const openMailtoFallback = () => {
    const subject = encodeURIComponent(`【SALON三日月】慧月予約のお知らせ - ${form.customerName} 様`);
    const dt = form.sessionDate ? fmtDateTime(form.sessionDate) : '(日時未定)';
    const body = encodeURIComponent(
      `${form.counselorName || '公認心理師'} 様\n\n` +
      `SALON三日月よりオンラインカウンセリング(慧月)の予約をお知らせいたします。\n\n` +
      `─────────────────────\n` +
      `■ クライアント:${form.customerName}\n` +
      `■ 予約日時:${dt}\n` +
      `■ セッション回:${form.sessionNumber}回目(全2回)\n` +
      (form.zoomUrl ? `■ Zoom URL:${form.zoomUrl}\n` : '') +
      `─────────────────────\n\n` +
      `※ 公認心理師法に基づき、クライアントから発信された事実のみをご記録ください。\n\n` +
      `当日はよろしくお願いいたします。\n\nSALON三日月\n`
    );
    window.location.href = `mailto:${form.counselorEmail}?subject=${subject}&body=${body}`;
    onNotified(nowISO());
  };

  return (
    <div className="bg-violet-50/40 border border-violet-200 rounded-lg p-3 space-y-2">
      <div className="flex items-center justify-between">
        <div className="text-xs font-medium text-violet-800 flex items-center gap-1">
          <Icon name="bell" className="w-3 h-3" />
          公認心理師への自動通知
        </div>
        {form.notifiedAt && (
          <span className="text-xs text-violet-700 bg-violet-100 px-2 py-0.5 rounded-full">
            通知済 {fmtDateTime(form.notifiedAt)}
          </span>
        )}
      </div>

      <button
        type="button"
        onClick={sendAutomatic}
        disabled={sending}
        className="w-full px-3 py-2 text-sm bg-violet-600 text-white rounded hover:bg-violet-700 disabled:bg-violet-300 disabled:cursor-wait flex items-center justify-center gap-2 transition-colors"
      >
        {sending ? (
          <>
            <span className="inline-block w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            <span>送信中...</span>
          </>
        ) : (
          <>
            <Icon name="send" />
            <span>{form.notifiedAt ? '自動で再送信' : '自動で通知メール送信'}</span>
          </>
        )}
      </button>

      {result && result.type === 'success' && (
        <div className="text-xs text-emerald-800 bg-emerald-50 border border-emerald-200 rounded px-2 py-1.5 flex items-start gap-1">
          <Icon name="check-circle" className="mt-0.5 w-3 h-3 flex-shrink-0" />
          <span>{result.msg}</span>
        </div>
      )}

      {result && result.type === 'error' && (
        <div className="text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded px-2 py-1.5 space-y-1">
          <div className="flex items-start gap-1">
            <Icon name="alert-circle" className="mt-0.5 w-3 h-3 flex-shrink-0" />
            <span><strong>送信エラー:</strong> {result.msg}</span>
          </div>
          <button
            type="button"
            onClick={openMailtoFallback}
            className="text-xs text-violet-700 hover:underline ml-4 cursor-pointer"
          >
            → 代わりにメーラーで開く(手動送信)
          </button>
        </div>
      )}

      <div className="text-xs text-violet-700 flex items-start gap-1">
        <Icon name="info" className="mt-0.5 w-3 h-3 flex-shrink-0" />
        <span>「自動で通知メール送信」を押すと、公認心理師のメールアドレスへ自動で配信されます(Vercel Functions + Resend経由)。</span>
      </div>
    </div>
  );
};

const fmtDateTime = (iso) => {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '-';
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};

  const internalShareDenied = selectedCustomer && !selectedCustomer.consent?.internalShare;

  const handleSubmit = () => {
    if (!form.customerId) { alert('顧客を選択してください。'); return; }
    if (!form.treatmentDate) { alert('施術日時を入力してください。'); return; }
    if (!form.clientStatement.trim()) { alert('クライアントの訴えを入力してください。'); return; }
    if (!form.treatmentContent.trim()) { alert('実施したケア・施術内容を入力してください。'); return; }
    if (isPT && form.medicalReferralNeeded && !form.medicalReferralDetail.trim()) {
      alert('医師連携が必要な場合は、内容を記入してください。'); return;
    }
    const final = { ...form, updatedAt: nowISO() };
    if (!isEdit) final.createdAt = nowISO();
    onSave(final);
  };

  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
      <div className="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">

          <button onClick={onCancel} className="text-stone-400 hover:text-stone-600"><Icon name="x" /></button>
        </div>
        <div className="px-5 py-4 space-y-4">
          <div>
            <label className="block text-xs font-medium text-stone-600 mb-1">顧客 <span className="text-rose-500">*</span></label>
            <select value={form.customerId} onChange={e => update('customerId', e.target.value)}
              className="w-full border border-stone-300 rounded px-3 py-2 text-sm">
              <option value="">選択してください</option>
              {customers.map(c => (
                <option key={c.id} value={c.id}>{c.pseudonym}{c.consent?.internalShare ? '' : ' ⚠'}</option>
              ))}
            </select>
            {internalShareDenied && (
              <div className="mt-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1 flex items-start gap-1">
                <Icon name="alert-circle" className="mt-0.5 w-3 h-3" />
                <span>この顧客は「内部共有」未同意です。記録はスタッフ間で共有されません(本人と担当のみ)。</span>
              </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-xs font-medium text-stone-600 mb-1">施術日時 <span className="text-rose-500">*</span></label>
              <input type="datetime-local" value={form.treatmentDate} onChange={e => update('treatmentDate', e.target.value)}

            </div>
            <div>
              <label className="block text-xs font-medium text-stone-600 mb-1">担当職種</label>
              <select value={form.staffRole} onChange={e => update('staffRole', e.target.value)}

const SettingsPage = ({ customers, treatments = [], keigetsuSessions = [], reservations = [], onClearAll }) => {
  const [showAudit, setShowAudit] = useState(false);
  const [auditLogs, setAuditLogs] = useState([]);

  const loadAudit = () => {
    try {
      const logs = JSON.parse(localStorage.getItem('mikazuki_audit') || '[]');
      setAuditLogs(logs.slice().reverse());
      setShowAudit(true);
    } catch (e) {
      setAuditLogs([]);
      setShowAudit(true);
    }
  };

  const handleExport = () => {
    const data = {
      exportedAt: nowISO(),
      customers,
      reservations,
      treatments,
      keigetsuSessions,
      audit: JSON.parse(localStorage.getItem('mikazuki_audit') || '[]'),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `salon_mikazuki_export_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    appendAuditLog('export', 'all', `${customers.length} customers / ${reservations.length} reservations / ${treatments.length} treatments / ${keigetsuSessions.length} keigetsu`);
  };

  const handleClearAll = () => {
    if (!confirm('全データ(顧客マスター・来店予約・施術記録・慧月予約・操作ログ等)を削除します。\nこの操作は取り消せません。よろしいですか?')) return;
    if (!confirm('本当によろしいですか?もう一度確認します。')) return;
    onClearAll();
  };

  return (
    <div className="max-w-5xl mx-auto px-4 py-6">
      <h2 className="serif-jp text-2xl text-stone-800 mb-2">設定</h2>
      <p className="text-sm text-stone-500 mb-6">データ管理・操作ログ・システム情報</p>

      <div className="space-y-4">
        {/* システム情報 */}
        <div className="bg-white border border-stone-200 rounded-lg p-5">
          <h3 className="text-sm font-medium text-stone-700 mb-3 flex items-center gap-2">
            <Icon name="shield" />システム情報
          </h3>
          <div className="text-xs text-stone-600 space-y-1">
            <div><strong>システム名</strong>: SALON三日月 顧客管理システム</div>
            <div><strong>開示範囲</strong>: SALONスタッフのみ(ホテル三日月には開示しない)</div>
            <div><strong>守秘義務</strong>: 全スタッフに課す</div>
            <div><strong>データ保管</strong>: ブラウザのlocalStorage(Phase 1)→ Supabase東京リージョン(Phase 2予定)</div>
            <div><strong>法令準拠</strong>: 個人情報保護法・薬機法・景表法・公認心理師法・保健師助産師看護師法</div>
          </div>
        </div>

        {/* データエクスポート */}
        <div className="bg-white border border-stone-200 rounded-lg p-5">
          <h3 className="text-sm font-medium text-stone-700 mb-3 flex items-center gap-2">
            <Icon name="download" />データエクスポート
          </h3>
          <p className="text-xs text-stone-500 mb-3">
            全顧客マスターと操作ログを JSON 形式でダウンロードします(バックアップ目的)。
          </p>
          <button
            onClick={handleExport}
            className="px-4 py-2 bg-stone-700 hover:bg-stone-800 text-white rounded text-sm flex items-center gap-2"
          >
            <Icon name="download" />エクスポート実行
          </button>
        </div>

        {/* 操作ログ */}
        <div className="bg-white border border-stone-200 rounded-lg p-5">
          <h3 className="text-sm font-medium text-stone-700 mb-3 flex items-center gap-2">
            <Icon name="file-text" />操作ログ(監査用)
          </h3>
          <p className="text-xs text-stone-500 mb-3">
            すべての顧客データ閲覧・変更が記録されます(直近1000件)。
          </p>
          <button
            onClick={loadAudit}
            className="px-4 py-2 border border-stone-300 hover:bg-stone-50 rounded text-sm"
          >
            {showAudit ? `操作ログを再読込(${auditLogs.length}件)` : '操作ログを表示'}
          </button>
          {showAudit && (
            <div className="mt-3 max-h-96 overflow-y-auto border border-stone-200 rounded">
              <table className="w-full text-xs">
                <thead className="bg-stone-50 text-stone-600 sticky top-0">
                  <tr>
                    <th className="text-left px-3 py-2">日時</th>
                    <th className="text-left px-3 py-2">操作</th>
                    <th className="text-left px-3 py-2">対象</th>
                    <th className="text-left px-3 py-2">詳細</th>
                  </tr>
                </thead>
                <tbody>
                  {auditLogs.length === 0 ? (
                    <tr><td colSpan={4} className="text-center py-4 text-stone-400">ログはありません</td></tr>
                  ) : auditLogs.map(log => (
                    <tr key={log.id} className="border-t border-stone-100">
                      <td className="px-3 py-1.5 text-stone-600">{fmtDateTime(log.timestamp)}</td>
                      <td className="px-3 py-1.5">
                        <span className="px-1.5 py-0.5 rounded bg-stone-100 text-stone-700">{log.action}</span>
                      </td>
                      <td className="px-3 py-1.5 text-stone-600">{log.target}</td>
                      <td className="px-3 py-1.5 text-stone-500">{log.detail}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>

        {/* 危険な操作 */}
        <div className="bg-rose-50 border border-rose-200 rounded-lg p-5">
          <h3 className="text-sm font-medium text-rose-800 mb-3 flex items-center gap-2">
            <Icon name="alert-circle" />危険な操作
          </h3>
          <p className="text-xs text-rose-700 mb-3">

          </p>
          <button
            onClick={handleClearAll}
            className="px-4 py-2 border border-rose-400 text-rose-700 hover:bg-rose-100 rounded text-sm flex items-center gap-2"
          >
            <Icon name="trash" />全データを削除
          </button>
        </div>
      </div>
    </div>
  );
};

const App = () => {
  const [page, setPage] = useState('dashboard');
  const [customers, setCustomers] = useLocalState('mikazuki_customers', []);
  const [treatments, setTreatments] = useLocalState('mikazuki_treatments', []);
  const [keigetsuSessions, setKeigetsuSessions] = useLocalState('mikazuki_keigetsu_sessions', []);
  const [reservations, setReservations] = useLocalState('mikazuki_reservations', []);
  const [editingId, setEditingId] = useState(null);
  const [viewingId, setViewingId] = useState(null);
  const [showForm, setShowForm] = useState(false);

  // 顧客の保存(新規・更新)
  const saveCustomer = (record) => {
    const exists = customers.find(c => c.id === record.id);
    if (exists) {
      setCustomers(customers.map(c => c.id === record.id ? record : c));
      appendAuditLog('update', `customer:${record.id}`, `pseudonym=${record.pseudonym}`);
    } else {
      setCustomers([...customers, record]);
      appendAuditLog('create', `customer:${record.id}`, `pseudonym=${record.pseudonym}`);
    }
    setShowForm(false);
    setEditingId(null);
    setViewingId(record.id);
  };

  // 顧客の削除
  const deleteCustomer = (id) => {
    const target = customers.find(c => c.id === id);
    setCustomers(customers.filter(c => c.id !== id));
    appendAuditLog('delete', `customer:${id}`, `pseudonym=${target?.pseudonym || ''}`);
    setShowForm(false);
    setEditingId(null);
    setViewingId(null);
  };

  // 施術記録の保存
  const saveTreatment = (record) => {
    const exists = treatments.find(t => t.id === record.id);
    if (exists) {
      setTreatments(treatments.map(t => t.id === record.id ? record : t));
      appendAuditLog('update', `treatment:${record.id}`, `customer=${record.customerId}, role=${record.staffRole}`);
    } else {
      setTreatments([...treatments, record]);
      appendAuditLog('create', `treatment:${record.id}`, `customer=${record.customerId}, role=${record.staffRole}`);
    }
  };

  // 施術記録の削除
  const deleteTreatment = (id) => {
    setTreatments(treatments.filter(t => t.id !== id));
    appendAuditLog('delete', `treatment:${id}`);
  };

  // 慧月予約の保存
  const saveKeigetsuSession = (record) => {
    const exists = keigetsuSessions.find(s => s.id === record.id);
    if (exists) {
      setKeigetsuSessions(keigetsuSessions.map(s => s.id === record.id ? record : s));
      appendAuditLog('update', `keigetsu:${record.id}`, `customer=${record.customerName}, status=${record.status}`);
    } else {
      setKeigetsuSessions([...keigetsuSessions, record]);
      appendAuditLog('create', `keigetsu:${record.id}`, `customer=${record.customerName}, status=${record.status}`);
    }
  };

  // 慧月予約の削除
  const deleteKeigetsuSession = (id) => {
    setKeigetsuSessions(keigetsuSessions.filter(s => s.id !== id));
    appendAuditLog('delete', `keigetsu:${id}`);
  };

  // 来店予約の保存
  const saveReservation = (record) => {
    const exists = reservations.find(r => r.id === record.id);
    if (exists) {
      setReservations(reservations.map(r => r.id === record.id ? record : r));
      appendAuditLog('update', `reservation:${record.id}`, `customer=${record.customerName}, status=${record.status}, source=${record.source}`);
    } else {
      setReservations([...reservations, record]);
      appendAuditLog('create', `reservation:${record.id}`, `customer=${record.customerName}, source=${record.source}`);
    }
  };

  // 来店予約の削除
  const deleteReservation = (id) => {
    setReservations(reservations.filter(r => r.id !== id));
    appendAuditLog('delete', `reservation:${id}`);
  };

  // 顧客選択(詳細表示)
  const selectCustomer = (id) => {
    setViewingId(id);
    appendAuditLog('view', `customer:${id}`);
  };

  // 編集開始
  const openEdit = (id) => {
    setEditingId(id);
    setShowForm(true);
  };

  // 新規登録開始
  const openNew = () => {
    setEditingId(null);
    setShowForm(true);
  };

  // フォームを閉じる
  const closeForm = () => {
    setShowForm(false);
    setEditingId(null);
  };

  // 全データクリア
  const clearAll = () => {
    setCustomers([]);
    setTreatments([]);
    setKeigetsuSessions([]);
    setReservations([]);
    localStorage.removeItem('mikazuki_audit');
    appendAuditLog('reset', 'all', 'all data cleared');
    setPage('dashboard');
    setViewingId(null);
  };

  // ページ切り替え時に詳細表示・フォームをリセット
  const onNav = (next) => {
    setPage(next);
    setViewingId(null);
    setShowForm(false);
    setEditingId(null);
  };

  // 現在編集中の顧客
  const editingCustomer = editingId ? customers.find(c => c.id === editingId) : null;
  // 現在閲覧中の顧客
  const viewingCustomer = viewingId ? customers.find(c => c.id === viewingId) : null;

  // 画面ルーティング
  let content;
  if (page === 'customers') {
    if (showForm) {
      content = (
        <CustomerForm
          initial={editingCustomer}
          onSave={saveCustomer}
          onCancel={closeForm}
          onDelete={deleteCustomer}
        />
      );
    } else if (viewingCustomer) {
      content = (
        <CustomerDetail
          customer={viewingCustomer}
          onBack={() => setViewingId(null)}
          onEdit={openEdit}
          treatments={treatments}
          keigetsuSessions={keigetsuSessions}
        />
      );
    } else {
      content = (
        <Customers
          customers={customers}
          setCustomers={setCustomers}
          onSelectCustomer={selectCustomer}
          onOpenForm={openNew}
        />
      );
    }
  } else if (page === 'reservation') {
    content = (
      <ReservationPage
        reservations={reservations}
        customers={customers}
        onSave={saveReservation}
        onDelete={deleteReservation}
      />
    );
  } else if (page === 'keigetsu') {
    content = (
      <KeigetsuPage
        sessions={keigetsuSessions}
        customers={customers}
        onSave={saveKeigetsuSession}
        onDelete={deleteKeigetsuSession}
      />
    );
  } else if (page === 'records') {
    content = (
      <RecordsPage
        treatments={treatments}
        customers={customers}
        onSave={saveTreatment}
        onDelete={deleteTreatment}
      />
    );
  } else if (page === 'settings') {
    content = <SettingsPage customers={customers} treatments={treatments} keigetsuSessions={keigetsuSessions} reservations={reservations} onClearAll={clearAll} />;
  } else {
    content = <Dashboard customers={customers} treatments={treatments} keigetsuSessions={keigetsuSessions} reservations={reservations} onNav={onNav} />;
  }

  return (
    <div className="min-h-screen bg-stone-50">
      <Header />
      <Nav currentPage={page} onNav={onNav} />
      <main>{content}</main>
      <Footer />
    </div>
  );
};

// ============================================================
// レンダリング
// ============================================================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
